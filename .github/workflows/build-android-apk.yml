name: Build KARSA Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "lib/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.karitas .

      - name: Set Android compile SDK to 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]
          for path in candidates:
              if not path.exists():
                  continue
              content = path.read_text()
              content, count_kts = re.subn(
                  r"compileSdk\\s*=\\s*flutter\\.compileSdkVersion",
                  "compileSdk = 36",
                  content,
              )
              content, count_groovy = re.subn(
                  r"compileSdkVersion\\s+flutter\\.compileSdkVersion",
                  "compileSdkVersion 36",
                  content,
              )
              if count_kts + count_groovy:
                  path.write_text(content)
                  print(f"Updated {path} to compile SDK 36")
                  break
          else:
              raise SystemExit("Could not find Android app Gradle file or compileSdk setting")
          PY
          yes | sdkmanager "platforms;android-36"

      - name: Install dependencies
        run: flutter pub get

      - name: Generate KARSA launcher icons
        run: dart run flutter_launcher_icons

      - name: Set Android app display name
        run: |
          sed -i 's/android:label="karsa_app"/android:label="KARSA"/' android/app/src/main/AndroidManifest.xml

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/KARSA.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KARSA-Android-APK
          path: build/app/outputs/flutter-apk/KARSA.apk
          if-no-files-found: error
          retention-days: 14
